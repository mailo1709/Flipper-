<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05030f" />
  <title>NOVA ARCADE</title>

  <!-- PWA / Installierbar als App -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NOVA ARCADE" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon-192.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">

  <!-- HOME / HUB -->
  <section id="home" class="view">
    <header class="hometop">
      <div class="brand">NOVA <span>ARCADE</span></div>
      <div class="homebtns">
        <button id="navScores" aria-label="Bestenliste">🏆</button>
        <button id="navSettings" aria-label="Einstellungen">⚙️</button>
      </div>
    </header>
    <p id="playerLine" class="playerline"></p>
    <div id="gameGrid" class="grid"></div>
    <p class="foot">Tippe ein Spiel an · läuft offline · weitere Games folgen</p>
  </section>

  <!-- STAGE (laufendes Spiel) -->
  <section id="stage" class="view" hidden>
    <header class="stagetop">
      <button id="backBtn" class="back" aria-label="Zurück">←</button>
      <div id="stageTitle" class="stagetitle"></div>
      <div id="stageMeta" class="stagemeta"></div>
    </header>
    <div class="canvasWrap"><canvas id="gameCanvas"></canvas></div>
    <div id="controls" class="controls"></div>
  </section>

  <!-- BESTENLISTE -->
  <section id="scores" class="view" hidden>
    <header class="subtop"><button class="back" data-home aria-label="Zurück">←</button><h2>🏆 Bestenliste</h2></header>
    <div id="scoreTabs" class="tabs"></div>
    <div id="scoreList" class="scorelist"></div>
    <p class="foot">Tipp: Gleicher Name = gleiches Gerät. So spielt ihr „Pass &amp; Play" gegen Freunde.</p>
  </section>

  <!-- EINSTELLUNGEN -->
  <section id="settings" class="view" hidden>
    <header class="subtop"><button class="back" data-home aria-label="Zurück">←</button><h2>⚙️ Einstellungen</h2></header>
    <div class="setgroup"><h3>Dein Name</h3><input id="nameInput" maxlength="12" placeholder="Spieler" /></div>
    <div class="setgroup"><h3>Schwierigkeit</h3><div id="diffRow" class="chiprow"></div></div>
    <div class="setgroup"><h3>Kugel-Skin</h3><div id="skinRow" class="chiprow"></div></div>
  </section>

</div>

  <script src="app.js"></script>
  <script src="games/pinball.js"></script>
  <script src="games/breakout.js"></script>
  <script src="games/snake.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));
    }
  </script>
</body>
</html>
